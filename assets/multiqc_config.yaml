title: "NGS Sequencing Local Pipeline"
subtitle: "Quality Control Report"
intro_text: >
    This report aggregates QC metrics from all pipeline stages: raw and trimmed read
    QC (FastQC, Fastp), alignment statistics (BWA mem, Samtools Flagstat).

export_plots: true
disable_version_detection: true

# Clean up sample names — strip trimming/sequencing suffixes so raw and trimmed
# samples display with the same name and line up in the General Stats table
extra_fn_clean_exts:
    - ".trimmed"
    - "_001"
    - ".fastp"
    - ".flagstat"
    - ".sorted"
    - type: regex
      pattern: "_S\\d+"

# Group R1/R2 under the same sample in the General Stats table
# while keeping them as separate rows
table_sample_merge:
    "Read 1":
        - "_R1"
        - type: regex
          pattern: "[_.-][rR]?1$"
    "Read 2":
        - "_R2"
        - type: regex
          pattern: "[_.-][rR]?2$"

# Search pattern overrides to speed up file discovery
sp:
    fastp:
        fn: "*.fastp.json"
    samtools/flagstat:
        fn: "*.flagstat.txt"

# Run only the modules relevant to this pipeline
run_modules:
    - custom_content
    - fastqc
    - fastp
    - samtools

# Section ordering and FastQC raw/trimmed split via path_filters
module_order:
    - fastqc:
        anchor: "fastqc_raw"
        name: "FastQC (raw)"
        info: "FastQC results before adapter trimming."
        path_filters:
            - "*_fastqc.zip"
        path_filters_exclude:
            - "*.trimmed_fastqc.zip"
    - fastp
    - fastqc:
        anchor: "fastqc_trimmed"
        name: "FastQC (trimmed)"
        info: "FastQC results after adapter trimming."
        path_filters:
            - "*.trimmed_fastqc.zip"
    - samtools
    - custom_content

report_section_order:
    fastqc_raw:
        order: 100
    fastp:
        order: 90
    fastqc_trimmed:
        order: 80
    samtools-flagstat:
        order: 70
    bwa_alignment_stats:
        order: 60
    software_versions:
        order: -1000

# General Stats: hide % duplicates (no dedup step) and fastp GC (redundant with FastQC)
table_columns_visible:
    "FastQC (raw)":
        percent_duplicates: false
    "FastQC (trimmed)":
        percent_duplicates: false
    Fastp:
        pct_gc: false

# Rename columns to clarify raw vs trimmed
table_columns_name:
    "FastQC (raw)":
        percent_gc: "% GC (raw)"
        total_sequences: "Seqs (raw)"
    "FastQC (trimmed)":
        percent_gc: "% GC (trimmed)"
        total_sequences: "Seqs (trimmed)"
