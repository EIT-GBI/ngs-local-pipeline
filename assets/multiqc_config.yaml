title: "NGS Sequencing Local Pipeline"
subtitle: "Quality Control Report"
intro_text: >
    This report aggregates QC metrics from all pipeline stages: raw and trimmed read
    QC (FastQC, Fastp), alignment statistics (BWA mem, Samtools Flagstat).

export_plots: true
disable_version_detection: true

# Clean up sample names — strip trimming/sequencing suffixes so raw and trimmed
# samples display with the same name and line up in the General Stats table
extra_fn_clean_exts:
    - ".trimmed"
    - "_R1"
    - "_R2"
    - "_001"
    - ".fastp"
    - ".flagstat"
    - ".sorted"

# Search pattern overrides to speed up file discovery
sp:
    fastp:
        fn: "*.fastp.json"
    samtools/flagstat:
        fn: "*.flagstat.txt"

# Run only the modules relevant to this pipeline
run_modules:
    - custom_content
    - fastqc
    - fastp
    - samtools

# Section ordering and FastQC raw/trimmed split via path_filters
module_order:
    - fastqc:
        anchor: "fastqc_raw"
        name: "FastQC (raw)"
        info: "FastQC results before adapter trimming."
        path_filters:
            - "*_fastqc.zip"
        path_filters_exclude:
            - "*.trimmed_fastqc.zip"
    - fastp
    - fastqc:
        anchor: "fastqc_trimmed"
        name: "FastQC (trimmed)"
        info: "FastQC results after adapter trimming."
        path_filters:
            - "*.trimmed_fastqc.zip"
    - samtools
    - custom_content

report_section_order:
    fastqc_raw:
        order: 100
    fastp:
        order: 90
    fastqc_trimmed:
        order: 80
    samtools-flagstat:
        order: 70
    bwa_alignment_stats:
        order: 60

# Hide % duplicates from General Stats (not meaningful without dedup step)
table_columns_visible:
    "FastQC (raw)":
        percent_duplicates: false
    "FastQC (trimmed)":
        percent_duplicates: false
